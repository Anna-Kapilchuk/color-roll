<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>גלגול צבעים</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="theme-color" content="#5b4bdb">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="גלגול צבעים">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Secular+One&display=swap">
<style>
/* Layout: one column. Menu = brand, play button, mode tabs, paged level grid of painted thumbnails.
   Game = HUD, colour chips, square picture card, long dark track panel, power-up bar. Sheets slide up from the bottom. */
:root{
  --ink:#1b1e45;
  --ink-soft:#5b6094;
  --paper:#f1f0fa;
  --card:#ffffff;
  --canvas:#f4f5fc;
  --sun:#ffc933;
  --sun-deep:#d99b00;
  --line:rgba(27,30,69,.10);
  --track-1:#272c69;
  --track-2:#15183f;
  --display:'Secular One','Rubik',system-ui,sans-serif;
  --body:'Rubik',system-ui,'Segoe UI',Arial,sans-serif;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--paper);color:var(--ink);font-family:var(--body);font-size:16px;overflow:hidden;overscroll-behavior:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:
  radial-gradient(55% 38% at 100% 0%,#ffd9e8 0,transparent 70%),
  radial-gradient(60% 42% at 0% 100%,#cfeaff 0,transparent 70%),
  radial-gradient(42% 30% at 0% 0%,#fff0c2 0,transparent 70%),var(--paper)}
button{font-family:inherit;color:inherit}
#app{position:relative;height:100%;overflow:hidden}
.screen{position:absolute;inset:0;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:480px;height:100%;margin-inline:auto;display:flex;flex-direction:column;gap:9px;position:relative;min-height:0}

/* ---------- buttons ---------- */
.btn{border:0;cursor:pointer;font-family:var(--display);font-weight:400;font-size:20px;line-height:1;padding:17px 22px;border-radius:20px;background:#fff;color:var(--ink);box-shadow:0 5px 0 rgba(27,30,69,.14),0 0 0 1px var(--line);transition:transform .08s,box-shadow .08s;display:inline-flex;align-items:center;justify-content:center;gap:10px}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(27,30,69,.14),0 0 0 1px var(--line)}
.btn.primary{background:var(--sun);box-shadow:0 5px 0 var(--sun-deep)}
.btn.primary:active{box-shadow:0 2px 0 var(--sun-deep)}
.btn.small{font-size:16px;padding:13px 16px;border-radius:16px}
.btn:disabled{opacity:.5}
.btn:focus-visible,.iconbtn:focus-visible,.lv:focus-visible,.pw:focus-visible,.seg button:focus-visible{outline:3px solid #6c5ce7;outline-offset:2px}
.iconbtn{width:44px;height:44px;flex:none;border-radius:15px;border:0;background:#fff;box-shadow:0 4px 0 rgba(27,30,69,.12),0 0 0 1px var(--line);display:grid;place-items:center;cursor:pointer}
.iconbtn:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(27,30,69,.12),0 0 0 1px var(--line)}
.iconbtn:disabled{opacity:.35}
.iconbtn svg{width:20px;height:20px}

/* ---------- menu ---------- */
#menu{overflow-y:auto;-webkit-overflow-scrolling:touch}
#menu .wrap{height:auto;min-height:100%;gap:16px;padding-bottom:28px}
.brand{display:flex;align-items:center;gap:16px;padding-top:10px}
.logo{width:72px;height:72px;flex:none}
h1{font-family:var(--display);font-weight:400;font-size:40px;line-height:1.02;margin:0;text-wrap:balance}
.lede{margin:6px 0 0;color:var(--ink-soft);font-size:15px;line-height:1.45;text-wrap:balance}
.seg{display:grid;grid-template-columns:1fr 1fr;gap:4px;padding:4px;border-radius:18px;background:rgba(27,30,69,.08)}
.seg button{border:0;background:transparent;border-radius:14px;padding:12px 8px;font-family:var(--display);font-size:17px;cursor:pointer;color:var(--ink-soft);display:flex;flex-direction:column;gap:2px;align-items:center}
.seg button small{font-family:var(--body);font-size:12px;font-weight:500}
.seg button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 3px 10px -4px rgba(30,30,80,.4)}
.sect{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sect b{font-family:var(--display);font-weight:400;font-size:20px}
.sect small{font-size:13px;font-weight:600;color:var(--ink-soft);font-variant-numeric:tabular-nums}
.pager{display:flex;align-items:center;gap:8px}
.pager span{font-size:13px;font-weight:600;color:var(--ink-soft);min-width:70px;text-align:center;font-variant-numeric:tabular-nums}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.lv{position:relative;border:0;padding:8px 8px 10px;border-radius:22px;background:#fff;box-shadow:0 12px 24px -16px rgba(40,40,100,.55),0 0 0 1px var(--line);cursor:pointer;display:flex;flex-direction:column;gap:8px;text-align:start;transition:transform .12s}
.lv:active{transform:scale(.97)}
.thumb{position:relative;border-radius:15px;overflow:hidden;aspect-ratio:1;background:var(--canvas);display:block}
.thumb .img{display:block;width:100%;height:100%}
.thumb svg{display:block;width:100%;height:100%}
.thumb .num{position:absolute;top:6px;inset-inline-start:6px;min-width:26px;height:26px;padding:0 7px;border-radius:99px;background:rgba(255,255,255,.94);box-shadow:0 2px 6px rgba(27,30,69,.25);font:400 14px/26px var(--display);text-align:center;font-style:normal;color:var(--ink)}
.thumb .kindtag{position:absolute;bottom:6px;left:50%;transform:translateX(-50%);white-space:nowrap;border-radius:99px;padding:1px 10px;font:800 11px/18px var(--body);font-style:normal;color:#fff;box-shadow:0 2px 6px rgba(27,30,69,.3)}
.lv.mini .kindtag{background:#ff8a2b}
.lv.boss .kindtag{background:#e8283c}
.lv.mini{box-shadow:0 12px 24px -16px rgba(40,40,100,.55),0 0 0 2px #ff8a2b}
.lv.boss{box-shadow:0 12px 24px -14px rgba(232,40,60,.6),0 0 0 2.5px #e8283c}
.stars{display:flex;gap:2px;justify-content:center}
.stars svg{width:16px;height:16px}
.inv{display:flex;gap:8px;justify-content:center}
.inv span{display:flex;align-items:center;gap:6px;background:#fff;border-radius:99px;padding:6px 12px 6px 10px;font-weight:700;font-size:14px;box-shadow:0 0 0 1px var(--line);font-variant-numeric:tabular-nums}
.inv svg{width:18px;height:18px}
.tools{display:flex;gap:10px;align-items:center;justify-content:space-between;color:var(--ink-soft);font-size:13px}

/* ---------- game ---------- */
.hud{display:flex;align-items:center;gap:12px;height:46px;flex:none}
.hud-mid{flex:1;min-width:0;display:flex;flex-direction:column;gap:6px}
.hud-row{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
.hud-title{font-family:var(--display);font-size:18px;line-height:1.1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.score{font-weight:600;font-size:13px;color:var(--ink-soft);font-variant-numeric:tabular-nums;white-space:nowrap}
.score .clock{font-weight:800;color:var(--ink);font-size:14px;margin-inline-start:8px}
.score .clock.low{color:#e8283c;animation:tick .5s infinite alternate}
@keyframes tick{to{transform:scale(1.18)}}
.bar{height:8px;border-radius:99px;background:rgba(27,30,69,.10);overflow:hidden}
.bar i{display:block;height:100%;width:0;border-radius:inherit;background:linear-gradient(90deg,#ff6fae,#ffc933 55%,#4dbbff);transition:width .5s cubic-bezier(.2,.8,.2,1)}
.hearts{display:flex;gap:2px;flex:none}
.heart{width:26px;height:26px;transition:transform .2s}
.heart path{fill:#ff4d5e;transition:fill .2s}
.heart.lost path{fill:#c9cce2}
.heart.crack{animation:crack .5s}
@keyframes crack{0%{transform:scale(1)}25%{transform:scale(1.5) rotate(-12deg)}60%{transform:scale(.8) rotate(8deg)}100%{transform:scale(1)}}

.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;flex:none;min-height:34px}
.chip{--c:#999;--t:#fff;--p:0;flex:0 1 40px;min-width:24px;aspect-ratio:1;border-radius:50%;padding:3.5px;background:conic-gradient(var(--ink) calc(var(--p)*1%),#fff 0);box-shadow:0 0 0 1px var(--line),0 3px 8px -2px rgba(30,30,80,.45);transition:transform .15s,opacity .3s}
.chip .dot{width:100%;height:100%;border-radius:50%;background:var(--c);box-shadow:inset 0 -3px 0 rgba(0,0,0,.18);display:grid;place-items:center}
.chip b{font-weight:700;font-size:13px;color:var(--t);font-variant-numeric:tabular-nums;line-height:1}
.chip.bump{animation:bump .3s}
.chip.done{opacity:.45}
.chip.done b{font-size:0}
.chip.done .dot::after{content:"";width:46%;height:26%;border-left:3px solid var(--t);border-bottom:3px solid var(--t);transform:rotate(-45deg) translate(1px,-2px)}
@keyframes bump{50%{transform:scale(1.28)}}

.pic{flex:1;min-height:0;container-type:size;display:grid;place-items:center}
.card{--s:min(100cqw,100cqh);width:var(--s);height:var(--s);border-radius:26px;overflow:hidden;background:var(--canvas);box-shadow:0 22px 40px -22px rgba(40,40,110,.6),0 0 0 1px var(--line)}
.card svg{width:100%;height:100%;display:block}
.base{stroke:rgba(27,30,69,.17);stroke-width:.9;stroke-linejoin:round;transition:stroke-opacity .5s}
.reg.done .base{stroke-opacity:0}
.card.glow{animation:glow 1s ease-out}
@keyframes glow{0%{transform:scale(1)}30%{transform:scale(1.035)}100%{transform:scale(1)}}

.trackwrap{position:relative;flex:none;aspect-ratio:400/260;width:100%;border-radius:26px;background:linear-gradient(180deg,var(--track-1),var(--track-2));overflow:hidden;box-shadow:0 20px 30px -18px rgba(20,20,70,.75),inset 0 1px 0 rgba(255,255,255,.14)}
.wrap.sheeted .trackwrap,.wrap.sheeted .powers{display:none}
.trackwrap svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.trackwrap.slowfx{box-shadow:0 20px 30px -18px rgba(20,20,70,.75),inset 0 0 0 3px rgba(120,200,255,.7),inset 0 0 40px rgba(120,200,255,.35)}
.flow{animation:flow linear infinite;animation-duration:var(--fd,.2s)}
.paused .flow,.idle .flow{animation-play-state:paused}
@keyframes flow{to{stroke-dashoffset:-16}}
.ball.wrong .body{filter:grayscale(1) brightness(.92)}


#fx{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:4}
.flash{position:absolute;inset:0;pointer-events:none;z-index:3;opacity:0;box-shadow:inset 0 0 90px 10px rgba(255,60,80,.55)}
.flash.on{animation:flash .5s}
@keyframes flash{0%{opacity:1}100%{opacity:0}}
.wrap.shake{animation:shake .38s}
@keyframes shake{0%,100%{transform:none}20%{transform:translateX(-9px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}

/* ---------- countdown 3-2-1 ---------- */
.kind{font:800 13px/20px var(--body);border-radius:99px;padding:2px 10px;color:#fff}
.kind.mini{background:#ff8a2b}
.kind.boss{background:#e8283c}
.count{position:absolute;inset:0;z-index:4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;pointer-events:none}
.cn-top{display:flex;gap:8px;align-items:center;font-family:var(--display);font-size:22px;background:rgba(255,255,255,.94);border-radius:99px;padding:8px 18px;box-shadow:0 8px 24px -10px rgba(27,30,69,.5)}
.cn-num{font-family:var(--display);font-size:150px;line-height:1;color:#fff;min-height:150px;text-shadow:0 6px 0 rgba(27,30,69,.4),0 0 40px rgba(27,30,69,.45),0 0 3px rgba(27,30,69,.8)}
.cn-num.pop{animation:cnpop 1s ease-out both}
@keyframes cnpop{0%{transform:scale(.4);opacity:0}22%{transform:scale(1.18);opacity:1}100%{transform:scale(1);opacity:1}}
.cn-tip{max-width:320px;margin:0;text-align:center;background:rgba(255,255,255,.94);border-radius:18px;padding:10px 14px;font-size:14px;line-height:1.45;color:var(--ink-soft);box-shadow:0 8px 24px -10px rgba(27,30,69,.4)}

/* ---------- sheets ---------- */
.dim{position:absolute;inset:0;z-index:5;background:rgba(241,240,250,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{position:absolute;z-index:6;left:0;right:0;bottom:0;margin-inline:auto;max-width:480px;background:#fff;border-radius:32px 32px 0 0;padding:24px 22px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -24px 50px -22px rgba(20,20,70,.55),0 0 0 1px var(--line);display:flex;flex-direction:column;gap:12px;animation:up .45s cubic-bezier(.2,.9,.25,1)}
@keyframes up{from{transform:translateY(40%);opacity:0}to{transform:none;opacity:1}}
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.06em;color:var(--ink-soft);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tag{background:rgba(27,30,69,.08);border-radius:99px;padding:3px 10px;font-size:12px;letter-spacing:0}
.tag.hot{background:#ffe3e6;color:#c4182f}
.sheet h2{font-family:var(--display);font-weight:400;font-size:32px;line-height:1.05;margin:0;text-wrap:balance}
.sheet p{margin:0;color:var(--ink-soft);font-size:15px;line-height:1.5;text-wrap:pretty}
.row{display:flex;gap:10px}
.row .btn{flex:1}
.big-stars{display:flex;gap:8px;justify-content:center;padding:2px 0 4px}
.big-stars svg{width:60px;height:60px;overflow:visible}
.big-stars .on{animation:starpop .6s cubic-bezier(.2,1.6,.4,1) both}
@keyframes starpop{0%{transform:scale(0) rotate(-40deg)}100%{transform:scale(1) rotate(0)}}
.big-stars svg{transform-origin:50% 50%;transform-box:fill-box}
.stat{display:flex;justify-content:center;gap:24px;font-size:14px;color:var(--ink-soft)}
.stat b{display:block;font-family:var(--display);font-weight:400;font-size:24px;color:var(--ink);text-align:center;font-variant-numeric:tabular-nums}
.stat span{display:block;text-align:center}
.reward{display:flex;justify-content:center;gap:8px;align-items:center;font-weight:600;font-size:14px;color:var(--ink-soft)}
.reward svg{width:22px;height:22px}

/* ---------- v2 look: hub (menu, pvp, shop) ---------- */
#menu{padding:0;display:flex;flex-direction:column;overflow:hidden}
.topbar{flex:none;width:100%;max-width:480px;margin-inline:auto;display:flex;align-items:center;justify-content:space-between;gap:10px;padding:max(10px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) 6px max(16px,env(safe-area-inset-left,0px))}
.brandmini{display:flex;align-items:center;gap:8px;font-family:var(--display);font-size:21px;white-space:nowrap}
.brandmini svg{width:36px;height:36px;flex:none}
.wallet{display:flex;gap:8px}
.cur{border:0;display:flex;align-items:center;gap:6px;padding:4px 13px 4px 5px;border-radius:99px;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 5px 16px -8px rgba(27,30,69,.45),0 0 0 1px var(--line);font:800 15px var(--body);font-variant-numeric:tabular-nums;color:var(--ink);cursor:pointer;transition:transform .15s}
.cur svg{width:26px;height:26px;flex:none}
.cur.bump{animation:bump .4s}
.hub-scroll{flex:1;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:6px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px))}
.hub-scroll .wrap{height:auto;min-height:0;gap:14px;padding-bottom:6px}
.nav{flex:none;display:grid;grid-template-columns:repeat(3,1fr);gap:6px;width:calc(100% - 24px);max-width:456px;margin:0 auto calc(10px + env(safe-area-inset-bottom,0px));padding:6px;border-radius:28px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 16px 36px -14px rgba(27,30,69,.55),0 0 0 1px var(--line)}
.nav button{border:0;background:transparent;border-radius:22px;padding:7px 4px 5px;display:flex;flex-direction:column;align-items:center;gap:1px;font:700 12px var(--body);color:var(--ink-soft);cursor:pointer;transition:background .2s,transform .12s}
.nav button:active{transform:scale(.95)}
.nav button svg{width:27px;height:27px}
.nav button[aria-selected="true"]{background:linear-gradient(180deg,#fff0b8,#ffd358);color:var(--ink);box-shadow:inset 0 0 0 1px rgba(217,155,0,.45),0 6px 14px -8px rgba(217,155,0,.8)}
.nav button:focus-visible{outline:3px solid #6c5ce7;outline-offset:2px}

.sec{min-height:0}
.card2{border-radius:26px;background:#fff;box-shadow:0 16px 30px -20px rgba(40,40,100,.6),0 0 0 1px var(--line);padding:16px;display:flex;flex-direction:column;gap:10px}
.card2 h2{margin:0;font-family:var(--display);font-weight:400;font-size:24px}
.card2 p{margin:0;color:var(--ink-soft);font-size:14px;line-height:1.5}
.pvpart{display:flex;align-items:center;justify-content:center;gap:10px;padding:8px 0}
.pvpart svg{width:84px;height:84px}
.pvpart b{font-family:var(--display);font-weight:400;font-size:34px;color:#e8283c;text-shadow:0 3px 0 rgba(232,40,60,.18)}
.statrow{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.statrow div{background:var(--canvas);border-radius:16px;padding:10px 6px;text-align:center}
.statrow b{display:block;font-family:var(--display);font-weight:400;font-size:24px}
.statrow span{font-size:12px;color:var(--ink-soft)}
.rewardline{display:flex;gap:6px;align-items:center;justify-content:center;font-weight:700;font-size:14px;color:var(--ink-soft)}
.rewardline svg{width:22px;height:22px}
.btn.red{background:linear-gradient(180deg,#ff7a86,#ff4d5e);color:#fff;box-shadow:0 5px 0 #c42a3b}
.btn.red:active{box-shadow:0 2px 0 #c42a3b}

.stabs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding:4px;border-radius:18px;background:rgba(27,30,69,.08)}
.stabs button{border:0;background:transparent;border-radius:14px;padding:10px 4px;font-family:var(--display);font-size:16px;cursor:pointer;color:var(--ink-soft)}
.stabs button[aria-selected="true"]{background:#fff;color:var(--ink);box-shadow:0 3px 10px -4px rgba(30,30,80,.4)}
.shop-note{margin:0;font-size:13px;color:var(--ink-soft);text-align:center}
.chests{display:grid;gap:12px}
.chest{position:relative;overflow:hidden;border-radius:26px;padding:14px 14px 14px;display:grid;grid-template-columns:128px 1fr;gap:12px;align-items:center;color:var(--ink);box-shadow:0 16px 30px -20px rgba(40,40,100,.6),0 0 0 1px var(--line);background:#fff}
.chest.basic{background:linear-gradient(135deg,#fff,#fff3d6)}
.chest.premium{background:linear-gradient(135deg,#fff,#e9dcff)}
.chest svg.cs{width:96px;height:96px}
.chest h3{margin:0 0 2px;font-family:var(--display);font-weight:400;font-size:21px}
.chest p{margin:0 0 8px;font-size:13px;color:var(--ink-soft);line-height:1.4}
.odds{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:8px}
.odds i{font-style:normal;font-size:11px;font-weight:800;border-radius:99px;padding:2px 8px;color:#fff}
.t-common{background:#7d86b5}.t-rare{background:#2f8fe8}.t-epic{background:#a65cf0}
.buy{border:0;border-radius:16px;padding:11px 14px;font:800 16px var(--body);cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:7px;background:linear-gradient(180deg,#ffe27a,#ffc933);color:var(--ink);box-shadow:0 4px 0 #c98f00}
.buy:active{transform:translateY(2px);box-shadow:0 2px 0 #c98f00}
.buy:disabled,.buy.off{opacity:.45;box-shadow:0 4px 0 rgba(27,30,69,.2);background:#dfe2f2}
.buy.gem{background:linear-gradient(180deg,#9ff0ff,#4dc7ff);box-shadow:0 4px 0 #2a93c9}
.buy svg{width:20px;height:20px}
.buy .ci{width:24px;height:24px}
.skgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.sk{position:relative;border:0;text-align:center;padding:10px 6px 10px;border-radius:22px;background:#fff;box-shadow:0 12px 24px -18px rgba(40,40,100,.6),0 0 0 1px var(--line);cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px}
.sk svg{max-width:100%;height:auto}
.sk b{font-family:var(--display);font-weight:400;font-size:15px}
.sk small{font-size:11px;font-weight:800;color:#fff;border-radius:99px;padding:1px 9px}
.sk.on{box-shadow:0 0 0 3px #ffc933,0 14px 26px -16px rgba(217,155,0,.8)}
.sk.locked svg,.sk.locked img.skimg{filter:grayscale(1) brightness(.75) contrast(.85);opacity:.55}
.sk.locked b{color:var(--ink-soft)}
.sk .lock{position:absolute;top:8px;inset-inline-end:8px;width:22px;height:22px}
.sk .eq{position:absolute;top:8px;inset-inline-start:8px;background:#ffc933;border-radius:99px;font:800 11px var(--body);padding:2px 8px}
.pitems{display:grid;gap:12px}
.pitem{position:relative;overflow:hidden;border-radius:26px;padding:14px;display:grid;grid-template-columns:96px 1fr;gap:12px;align-items:center;color:#fff;box-shadow:0 16px 30px -18px rgba(20,20,70,.7)}
.pitem.reveal{background:radial-gradient(90% 120% at 0% 0%,#ffe27a 0,transparent 55%),linear-gradient(135deg,#2b2f6e,#171a4a)}
.pitem.slow{background:radial-gradient(90% 120% at 0% 0%,#bff0ff 0,transparent 55%),linear-gradient(135deg,#2d7fd6,#1c4aa0)}
.pitem.brush{background:radial-gradient(90% 120% at 0% 0%,#ffc2ec 0,transparent 55%),linear-gradient(135deg,#8e4de0,#5a2fb5)}
.pitem .pic{width:96px;height:96px;border-radius:24px;display:grid;place-items:center;background:rgba(255,255,255,.14);box-shadow:inset 0 0 0 1px rgba(255,255,255,.3)}

.pitem h3{margin:0;font-family:var(--display);font-weight:400;font-size:21px}
.pitem p{margin:2px 0 8px;font-size:13px;color:rgba(255,255,255,.85);line-height:1.35}
.pitem .row2{display:flex;align-items:center;justify-content:space-between;gap:8px}
.pitem .left{font-size:12px;font-weight:700;background:rgba(0,0,0,.25);border-radius:99px;padding:3px 10px;white-space:nowrap}
.pitem .own{position:absolute;top:10px;inset-inline-end:12px;font-weight:800;font-size:12px;background:rgba(0,0,0,.28);border-radius:99px;padding:2px 10px}

.modal{position:absolute;inset:0;z-index:20;display:flex;overflow-y:auto;padding:16px;background:rgba(27,30,69,.55);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.mbox{margin:auto;width:min(100%,360px);background:#fff;border-radius:32px;padding:22px 20px 20px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 30px 60px -20px rgba(0,0,0,.6)}
.mbox h2{margin:0;font-family:var(--display);font-weight:400;font-size:28px}
.mbox p{margin:0;color:var(--ink-soft);font-size:15px;line-height:1.5}
.mbox .big{width:150px;height:150px}
.mbox .row{width:100%}
.shake-box{animation:chestshake .6s ease-in-out infinite}
@keyframes chestshake{0%,100%{transform:rotate(0)}20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(4deg)}}
.pop-in{animation:popin .6s cubic-bezier(.2,1.5,.4,1) both}
@keyframes popin{0%{transform:scale(.2) rotate(-20deg);opacity:0}100%{transform:none;opacity:1}}
.spinner{width:54px;height:54px;border-radius:50%;border:6px solid rgba(27,30,69,.12);border-top-color:#ff4d5e;animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.vs{display:flex;align-items:center;justify-content:center;gap:14px;font-family:var(--display);font-size:26px}
.vs .who{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:15px}
.avatar{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font:400 28px var(--display);color:#fff;box-shadow:0 8px 18px -8px rgba(0,0,0,.5),inset 0 -5px 0 rgba(0,0,0,.18)}
.rcoin{display:inline-flex;align-items:center;gap:5px;font-weight:800;font-size:18px;font-variant-numeric:tabular-nums}
.rcoin svg{width:26px;height:26px}
.rewards{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;min-height:30px}
.rewards .rcoin{animation:popin .5s cubic-bezier(.2,1.5,.4,1) both}
/* ---------- v2 look: game screen, power-ups, pvp bar, toast ---------- */
body::before{background:
  radial-gradient(60% 40% at 100% 0%,#ffd1ea 0,transparent 70%),
  radial-gradient(60% 45% at 0% 100%,#c8e6ff 0,transparent 70%),
  radial-gradient(45% 32% at 0% 0%,#ffeeb8 0,transparent 70%),
  radial-gradient(42% 30% at 100% 100%,#e4d4ff 0,transparent 70%),var(--paper)}
.btn.primary{background:linear-gradient(180deg,#ffe27a,#ffc933)}
.lv{background:linear-gradient(180deg,#fff,#f7f6ff)}
.hud{background:rgba(255,255,255,.74);border-radius:22px;padding:0 6px 0 8px;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 8px 22px -14px rgba(27,30,69,.5),0 0 0 1px var(--line)}
.hud.pvp{height:62px}
.bar{height:9px}
.bar i{box-shadow:0 0 10px rgba(255,201,51,.65)}
.opp{display:flex;align-items:center;gap:8px}
.opp-name{font-size:12px;font-weight:800;color:#e8283c;white-space:nowrap;max-width:48%;overflow:hidden;text-overflow:ellipsis}
.opp .bar{flex:1;height:7px}
.opp .bar i{background:linear-gradient(90deg,#ff9a9a,#ff4d5e);box-shadow:0 0 8px rgba(255,77,94,.5)}
.heart{width:27px;height:27px;filter:drop-shadow(0 2px 3px rgba(255,77,94,.35))}
.chip{box-shadow:0 0 0 1px var(--line),0 5px 10px -4px rgba(30,30,80,.5)}
.card{border:5px solid #fff;box-shadow:0 28px 46px -26px rgba(40,40,110,.75),0 0 0 1px var(--line)}
.trackwrap{background:radial-gradient(120% 90% at 50% 0%,#3b41a0 0,transparent 62%),linear-gradient(180deg,#272c69,#11143a);box-shadow:0 22px 34px -18px rgba(20,20,70,.85),inset 0 1px 0 rgba(255,255,255,.2),inset 0 0 0 2px rgba(120,130,255,.2)}
.trackwrap::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;background-image:radial-gradient(rgba(255,255,255,.07) 1px,transparent 1.5px);background-size:14px 14px}
.sheet{border-radius:34px 34px 0 0}
.sheet.center{top:50%;bottom:auto;left:50%;right:auto;margin:0;width:min(calc(100% - 32px),400px);max-width:none;transform:translate(-50%,-50%);border-radius:34px;padding:24px 22px 22px;max-height:calc(100% - 32px);overflow:auto;animation:popc .45s cubic-bezier(.2,1.2,.3,1)}
@keyframes popc{from{opacity:0;transform:translate(-50%,-46%) scale(.9)}to{opacity:1;transform:translate(-50%,-50%) scale(1)}}
.big-stars svg.broken{width:72px;height:72px;overflow:visible;animation:none}
.big-stars .bk-l{animation:bkl .7s ease-out both}
.big-stars .bk-r{animation:bkr .7s ease-out both}
@keyframes bkl{from{transform:translate(2px,0)}to{transform:translate(-2px,1px) rotate(-6deg)}}
@keyframes bkr{from{transform:translate(0,0)}to{transform:translate(2.5px,1px) rotate(6deg)}}
.toast{position:absolute;z-index:30;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(27,30,69,.94);color:#fff;border-radius:99px;padding:10px 18px;font:700 14px var(--body);animation:toastin 2.2s both;max-width:90%;text-align:center;pointer-events:none}
@keyframes toastin{0%{opacity:0;transform:translate(-50%,10px)}12%,85%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,0)}}
.reward{flex-wrap:wrap;min-height:30px}
.reward .rcoin{animation:popin .5s cubic-bezier(.2,1.5,.4,1) both}
.reward .none{font-size:13px;color:var(--ink-soft)}

/* power-ups: every one has its own look */
.powers{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;flex:none}
.pw{position:relative;overflow:hidden;border:0;border-radius:20px;height:58px;display:grid;grid-template-columns:40px 1fr;align-items:center;gap:6px;padding:0 9px 0 6px;cursor:pointer;color:#fff;text-align:start;font-weight:600;font-size:13px;transition:transform .1s,filter .2s}
.pw:active{transform:translateY(3px)}
.pw .ic{position:relative;z-index:1;display:grid;place-items:center;width:40px;height:40px;border-radius:12px;background:none;box-shadow:none}
.pw .ic svg{width:26px;height:26px}
.pw .nm{position:relative;z-index:1;display:flex;flex-direction:column;font:800 14px/1.1 var(--body);min-width:0}
.pw .nm small{font:600 10.5px var(--body);opacity:.85;margin-top:2px;white-space:nowrap}
.pw em{position:absolute;z-index:2;top:0;inset-inline-end:0;min-width:24px;height:22px;padding:0 6px;border-end-start-radius:12px;background:rgba(0,0,0,.32);font:800 13px/22px var(--body);font-style:normal;text-align:center;min-width:24px;display:block;border-radius:0 0 0 12px}
.pw i{position:absolute;inset:0;transform-origin:right;transform:scaleX(0);z-index:0}
.pw.on i{transform:scaleX(var(--k,1))}
.pw.empty{filter:saturate(.4) brightness(.92);opacity:.8}
.pw[data-k="reveal"]{background:radial-gradient(70% 120% at 0% 0%,rgba(255,226,122,.35) 0,transparent 60%),linear-gradient(160deg,#343a8c,#171a4a);box-shadow:0 5px 0 #0b0d30,0 12px 18px -10px rgba(23,26,74,.8),inset 0 1px 0 rgba(255,255,255,.2)}
.pw[data-k="reveal"] .ic{background:none;box-shadow:none}
.pw[data-k="reveal"] i{background:linear-gradient(90deg,rgba(255,213,74,.55),rgba(255,213,74,.12))}
.pw[data-k="slow"]{background:linear-gradient(160deg,#52b4ff,#2063c9);box-shadow:0 5px 0 #14408b,0 12px 18px -10px rgba(32,99,201,.8),inset 0 1px 0 rgba(255,255,255,.35)}
.pw[data-k="slow"]::before{content:"";position:absolute;inset:-12px auto auto -12px;width:40px;height:40px;border-radius:50%;background:rgba(255,255,255,.2)}
.pw[data-k="slow"] i{background:linear-gradient(90deg,rgba(235,250,255,.7),rgba(235,250,255,.15))}
.pw[data-k="brush"]{background:linear-gradient(160deg,#c079ff,#6a35c9);box-shadow:0 5px 0 #43208f,0 12px 18px -10px rgba(106,53,201,.8),inset 0 1px 0 rgba(255,255,255,.3)}
.pw[data-k="brush"]::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 78% 30%,rgba(255,255,255,.6) 0 1.5px,transparent 2.2px),radial-gradient(circle at 60% 74%,rgba(255,255,255,.45) 0 1.2px,transparent 2px),radial-gradient(circle at 92% 80%,rgba(255,226,122,.7) 0 1.5px,transparent 2.2px)}
.pw[data-k="brush"] .ic{background:none}
.pwchip{display:grid;place-items:center;width:34px;height:34px;border-radius:12px}
.pwchip svg{width:26px;height:26px}
.pwchip.reveal{background:linear-gradient(160deg,#343a8c,#171a4a)}
.pwchip.slow{background:linear-gradient(160deg,#52b4ff,#2063c9)}
.pwchip.brush{background:linear-gradient(160deg,#c079ff,#6a35c9)}

.stat:empty,.reward:empty{display:none}
.nav{grid-template-columns:repeat(3,1fr)}
.nav button{position:relative;white-space:nowrap}
/* bottom dock: shop and battle icons at the two sides of the screen, the play button between them */
.dock{flex:none;display:flex;align-items:center;gap:10px;width:calc(100% - 24px);max-width:456px;margin:0 auto calc(10px + env(safe-area-inset-bottom,0px));padding:8px;border-radius:32px;background:rgba(255,255,255,.9);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 16px 36px -14px rgba(27,30,69,.55),0 0 0 1px var(--line)}
.dockbtn{flex:none;width:64px;height:64px;border:0;border-radius:24px;background:linear-gradient(180deg,#fff,#f1f0fa);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font:800 11px var(--body);color:var(--ink-soft);cursor:pointer;box-shadow:0 4px 0 rgba(27,30,69,.14),0 0 0 1px var(--line);transition:transform .1s}
.dockbtn:active{transform:translateY(3px);box-shadow:0 1px 0 rgba(27,30,69,.14),0 0 0 1px var(--line)}
.dockbtn svg{width:32px;height:32px}
.dockbtn[aria-selected="true"]{background:linear-gradient(180deg,#fff0b8,#ffd358);color:var(--ink);box-shadow:0 4px 0 #c98f00,0 0 0 1px rgba(217,155,0,.45)}
.dockbtn:focus-visible{outline:3px solid #6c5ce7;outline-offset:2px}
.dock .dockmain{flex:1;min-width:0;font-size:20px;padding:19px 10px;border-radius:24px;box-shadow:0 5px 0 #c98f00}
.dock .dockmain:active{box-shadow:0 2px 0 #c98f00}
.inv .pwchip{width:26px;height:26px;border-radius:9px}
.inv .pwchip svg{width:20px;height:20px}
.inv span{padding:4px 12px 4px 5px}

/* profile, icon bar, dock with the counter */
input{-webkit-user-select:text;user-select:text}
.prof{border:0;display:flex;align-items:center;gap:8px;padding:4px 14px 4px 5px;border-radius:99px;background:rgba(255,255,255,.86);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 5px 16px -8px rgba(27,30,69,.45),0 0 0 1px var(--line);cursor:pointer;color:var(--ink);text-align:start;min-width:0}
.av{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font:400 20px var(--display);color:#fff;box-shadow:inset 0 -4px 0 rgba(0,0,0,.18),0 0 0 2px #fff}
.av.big{width:84px;height:84px;font-size:42px}
.pn{display:flex;flex-direction:column;min-width:0}
.pn b{font:800 14px/1.15 var(--body);max-width:96px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pn small{font:700 11px/1.2 var(--body);color:var(--ink-soft)}
.iconbar{flex:none;width:100%;max-width:480px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:2px max(16px,env(safe-area-inset-right,0px)) 4px max(16px,env(safe-area-inset-left,0px))}
.ib{border:0;background:transparent;padding:2px 0 3px;display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;color:var(--ink);font:800 12px var(--body);border-radius:14px;transition:transform .1s}
.ib:active{transform:scale(.92)}
.ib .ico{display:grid;place-items:center;width:50px;height:50px}
.ib .ico svg{width:48px;height:48px;max-width:100%;filter:drop-shadow(0 4px 5px rgba(27,30,69,.28))}
.ib .lb{position:relative;padding-bottom:3px}
.ib[aria-selected="true"] .lb::after{content:"";position:absolute;left:10%;right:10%;bottom:0;height:3px;border-radius:3px;background:#ffc933}
.ib:focus-visible{outline:3px solid #6c5ce7;outline-offset:2px}
.dock{flex-direction:column;align-items:stretch;gap:6px;padding:8px 8px 8px}
.dockinfo{border:0;background:transparent;font:800 13px var(--body);color:var(--ink);text-align:center;cursor:pointer;padding:2px 6px}
.dockinfo.none{color:var(--ink-soft);font-weight:700}
.dock .dockmain{flex:none;width:100%}
.ptitle{margin:0;font-family:var(--display);font-weight:400;font-size:26px;text-align:center}
.avs{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:5px;width:100%}
.avsw{width:100%;max-width:34px;aspect-ratio:1;justify-self:center;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18),0 0 0 2px #fff,0 0 0 3px var(--line)}

  .pinput{padding:9px 12px;font-size:16px}
}

/* ---------- v3: home scene in the style of a mobile game, 3D sprites from blender/ ---------- */
.ci{width:1.25em;height:1.25em;object-fit:contain;vertical-align:-.28em;flex:none}
img.cs{width:96px;height:96px;object-fit:contain}
.chest img.cs{width:128px;height:128px;filter:drop-shadow(0 8px 8px rgba(40,20,80,.3))}
.mbox .big img{width:100%;height:100%;object-fit:contain}
.pimg{width:100%;height:100%;object-fit:contain;display:block}
.pw .ic img{width:40px;height:40px;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.35))}
.pitem .pic img{width:84px;height:84px;object-fit:contain;filter:drop-shadow(0 4px 4px rgba(0,0,0,.3))}
.pwchip img{width:26px;height:26px;object-fit:contain}
.inv .pwchip img{width:22px;height:22px}
.star{object-fit:contain}
.stars img{width:22px;height:22px}
.big-stars img{width:78px;height:78px;object-fit:contain;filter:drop-shadow(0 6px 6px rgba(0,0,0,.25))}

.heart{width:31px;height:31px;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(150,20,40,.35))}
.heart.lost{filter:none;opacity:.85}

.homescene{position:absolute;inset:0;z-index:0;overflow:hidden}
.homebg{position:absolute;inset:0;width:100%;height:100%;display:block}
.topbar{position:relative;z-index:3;direction:ltr}
.tl{display:flex;gap:10px;align-items:center}
.rbtn,.avbtn{flex:none;width:46px;height:46px;padding:0;cursor:pointer;display:grid;place-items:center;transition:transform .1s}
.rbtn:active,.avbtn:active{transform:scale(.92)}
.rbtn{border-radius:50%;border:3px solid #fff;background:radial-gradient(circle at 35% 25%,#79a8ff,#2a55c9);box-shadow:0 4px 0 rgba(10,30,100,.45),0 9px 14px -6px rgba(0,0,0,.5)}
.gi{width:30px;height:30px;object-fit:contain;display:block}
.avbtn{border-radius:15px;border:3px solid #ff3fb0;background:#fff;box-shadow:0 4px 0 rgba(120,0,80,.4),0 9px 14px -6px rgba(0,0,0,.45)}
.avbtn .av{width:34px;height:34px;font-size:18px;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.wallet{direction:ltr;gap:14px;padding-left:12px}
.pill{position:relative;display:flex;align-items:center;justify-content:flex-end;height:32px;min-width:98px;padding:0 13px 0 40px;border-radius:99px;border:2px solid #ffd45a;background:linear-gradient(180deg,#4274e8,#2149b4);color:#fff;font:900 17px var(--body);box-shadow:0 3px 0 rgba(10,30,100,.55),0 8px 12px -6px rgba(0,0,0,.45);cursor:pointer;font-variant-numeric:tabular-nums;transition:transform .15s}
.pill b{text-shadow:0 2px 0 rgba(10,30,100,.6)}
.pill .pico{position:absolute;left:-14px;top:50%;transform:translateY(-50%);width:46px;height:46px;display:grid;place-items:center}
.pill .pico .ci{width:46px;height:46px;vertical-align:0;filter:drop-shadow(0 3px 3px rgba(0,0,0,.4))}
.pill .plus{position:absolute;left:12px;bottom:-5px;width:17px;height:17px;border-radius:50%;background:#35d467;border:2px solid #fff;color:#fff;font:900 13px/12px var(--body);font-style:normal;text-align:center}
.pill.gem{border-color:#8fe6ff;background:linear-gradient(180deg,#3a9cf0,#1b5fc0);min-width:84px}
.pill.gem .pico .ci{width:40px;height:40px}
.pill.bump{animation:bump .4s}

.stage{position:absolute;left:50%;top:23%;transform:translateX(-50%);width:min(46vw,228px,44vh);z-index:1;display:flex;flex-direction:column;align-items:center}
.frame{position:relative;width:100%;aspect-ratio:1;padding:8px;border-radius:26px;background:linear-gradient(180deg,#fff,#eaf0ff);box-shadow:0 0 0 4px #ffc933,0 10px 0 2px #c98f00,0 26px 34px -10px rgba(10,30,100,.65);transform:rotate(-2.5deg)}
.hpic{display:block;width:100%;height:100%;border-radius:18px;overflow:hidden;background:var(--canvas)}
.hpic svg{display:block;width:100%;height:100%}
.lvb{position:absolute;top:-15px;left:50%;transform:translateX(-50%);white-space:nowrap;background:linear-gradient(180deg,#ff6a7a,#ff3149);color:#fff;border:3px solid #fff;border-radius:99px;padding:2px 18px;font:900 16px var(--body);box-shadow:0 3px 0 #b81a2e;text-shadow:0 2px 0 rgba(120,0,20,.5)}
.kindb{position:absolute;bottom:-13px;left:50%;transform:translateX(-50%);white-space:nowrap;border:3px solid #fff;border-radius:99px;padding:1px 14px;font:900 13px var(--body);color:#fff;box-shadow:0 3px 0 rgba(0,0,0,.25)}

.stage .stars{margin-top:20px;gap:4px}
.stage .stars img{width:32px;height:32px}

.side{position:absolute;top:calc(env(safe-area-inset-top,0px) + 108px);z-index:2;display:flex;flex-direction:column;gap:12px}

.side.r{right:max(8px,env(safe-area-inset-right,0px))}

<script>
(function(){
'use strict';
const NS='http://www.w3.org/2000/svg';
const rnd=()=>window.__rng?window.__rng():Math.random(); // __rng: seeded generator used by the bot tests
const TOTAL_C=200,TOTAL_T=50,PER_PAGE=12;

/* ================= storage ================= */
const KEY='gilgul-tzeva.v1';
let save={stars:{},tstars:{},best:{},tbest:{},sound:true,inv:{reveal:3,slow:3,brush:3},mode:'c',page:{c:0,t:0},skin:'candy',skins:['candy']};
try{const s=JSON.parse(localStorage.getItem(KEY)||'{}');Object.assign(save,s);save.inv=Object.assign({reveal:3,slow:3,brush:3},s.inv||{});save.page=Object.assign({c:0,t:0},s.page||{})}catch(e){}
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(save))}catch(e){}};

/* ================= colours ================= */
const K={
  sky:'#4dbbff', blue:'#3e7bfa', indigo:'#5b4bdb', purple:'#9b5cf6', pink:'#ff6fae', red:'#ff4d5e',
  orange:'#ff8a2b', yellow:'#ffc933', lime:'#9bdd3b', green:'#2dbe6c', teal:'#12b5a6', brown:'#a86a3d',
  navy:'#232a5c', mist:'#c9d6f2', cream:'#ffe2b0', rust:'#d9531e'
};
const ALLC=Object.values(K);
const hex2rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const rgb2hex=a=>'#'+a.map(v=>Math.max(0,Math.min(255,Math.round(v))).toString(16).padStart(2,'0')).join('');
const CANVAS='#f4f5fc';
const mix=(h,w)=>{const a=hex2rgb(h),b=hex2rgb(CANVAS);return rgb2hex(a.map((v,i)=>v*w+b[i]*(1-w)))};
const lum=h=>{const[r,g,b]=hex2rgb(h);return(.299*r+.587*g+.114*b)/255};
const cdist=(a,b)=>{const x=hex2rgb(a),y=hex2rgb(b);return Math.hypot(x[0]-y[0],x[1]-y[1],x[2]-y[2])};
const shade=(h,t,w)=>rgb2hex(hex2rgb(h).map(v=>v*(1-w)+t*w));
function toHSL(h){const[r,g,b]=hex2rgb(h).map(v=>v/255),mx=Math.max(r,g,b),mn=Math.min(r,g,b),d=mx-mn;let hh=!d?0:mx===r?((g-b)/d)%6:mx===g?(b-r)/d+2:(r-g)/d+4;const l=(mx+mn)/2;return[(hh*60+360)%360,!d?0:d/(1-Math.abs(2*l-1)),l]}
function fromHSL(h,s,l){h=((h%360)+360)%360;const a=s*Math.min(l,1-l),f=n=>{const k=(n+h/30)%12;return 255*(l-a*Math.max(-1,Math.min(k-3,9-k,1)))};return rgb2hex([f(0),f(8),f(4)])}
const hueRot=(h,deg)=>{if(!deg)return h;const[a,s,l]=toHSL(h);return fromHSL(a+deg,s,l)};

/* ================= pictures (packs of 10 levels, built by tools/build.py) ================= */
const packs=new Map(),picCache=new Map();
async function fetchJSON(u,tries=3){
  for(let i=0;i<tries;i++){
    const c=new AbortController(),t=setTimeout(()=>c.abort(),12000);
    try{const r=await fetch(u,{signal:c.signal});clearTimeout(t);if(!r.ok)throw new Error(r.status);return await r.json()}
    catch(e){clearTimeout(t);if(i===tries-1)throw e;await new Promise(r=>setTimeout(r,400*(i+1)))}
  }
}
function loadPack(k){
  if(!packs.has(k))packs.set(k,fetchJSON('pics/pack_'+String(k).padStart(2,'0')+'.json').catch(e=>{packs.delete(k);throw e}));
  return packs.get(k);
}
const flipPath=p=>p.replace(/(-?[\d.]+) (-?[\d.]+)/g,(m,x,y)=>(300-parseFloat(x)).toFixed(1)+' '+y);
async function getPicture(slot){
  if(picCache.has(slot))return picCache.get(slot);

const dayStr=()=>{const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
function shopState(){const t=dayStr();if(!save.shop||save.shop.day!==t){save.shop={day:t,bought:{reveal:0,slow:0,brush:0}};persist()}return save.shop}
function normalizeSave(){
  save.coins=Math.max(0,+save.coins||0);save.gems=Math.max(0,+save.gems||0);
  save.pvp=Object.assign({w:0,l:0},save.pvp||{});
  save.skins=(Array.isArray(save.skins)?save.skins:[]).filter(id=>SK[id]);
  if(!save.skins.includes('candy'))save.skins.unshift('candy');
  if(!SK[save.skin]||!save.skins.includes(save.skin))save.skin='candy';
  if(!save.shop||!save.shop.bought)save.shop={day:'',bought:{reveal:0,slow:0,brush:0}};
  save.tab=['home','levels','pvp','shop'].includes(save.tab)?save.tab:'home';
  save.stab=['chests','skins','power'].includes(save.stab)?save.stab:'chests';
  delete save.book; // the colour book was removed
  if(!save.econ){ // progress made before coins existed is paid out once
    let c=0,g=0;
    for(const m of ['c','t'])for(const [n,s] of Object.entries(stk(m))){if(s>0){c+=coinsFor(s,+n,m==='t');if(s>=3)g+=gemsFor(+n)}}
    save.coins+=c;save.gems+=g;save.econ=1;
  }
  save.profile=Object.assign({id:'',name:'',avatar:AVATARS[0],pic:'',created:0,visits:0},save.profile||{});
  if(!AVPICS.includes(save.profile.pic))save.profile.pic='';
  if(!save.profile.id){save.profile.id=newId();save.profile.created=Date.now()}
  if(!AVATARS.includes(save.profile.avatar))save.profile.avatar=AVATARS[0];
  save.profile.name=String(save.profile.name||'').slice(0,14);
  persist();
}
function drawSkin(premium){
  const pool=SKIN_IDS.filter(id=>!save.skins.includes(id));if(!pool.length)return null;
  const w=premium?{common:0,rare:70,epic:30}:{common:60,rare:30,epic:10};
  const tiers=['common','rare','epic'].filter(t=>w[t]>0&&pool.some(id=>SK[id].tier===t));
  const from=tiers.length?tiers:['common','rare','epic'].filter(t=>pool.some(id=>SK[id].tier===t));
  let r=rnd()*from.reduce((s,t)=>s+(w[t]||1),0),tier=from[0];
  for(const t of from){r-=(w[t]||1);if(r<=0){tier=t;break}}
  const ids=pool.filter(id=>SK[id].tier===tier);
  return ids[Math.floor(rnd()*ids.length)];
}

function sliceShape(bb,n,k,dir){

  if(dir==='r'){

function findTarget(path,bb,sl){

    let ok=true;try{ok=path.isPointInFill(new DOMPoint(px,py))}catch(e){}
    if(!ok)continue;

const SKIN_IDS=Object.keys(SK);
/* the pieces every ball shares: contact shadow, sphere shading, clip */
const BALL_DEFS=`<radialGradient id="bsh"><stop offset="0" stop-color="#000" stop-opacity=".5"/><stop offset="1" stop-color="#000" stop-opacity="0"/></radialGradient>
  <radialGradient id="bsph" cx=".36" cy=".3" r=".85"><stop offset="0" stop-color="#fff" stop-opacity=".3"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".3"/></radialGradient>
  <clipPath id="bclip"><circle r="${BR-1.4}"/></clipPath>`;
const skinKey=(sk,c)=>sk+c.slice(1);
const ballBody=(sk,c)=>(SK[sk]||SK.candy).body(c,skinKey(sk,c));
const ballFull=(sk,c)=>`<circle class="halo" r="${BR+7}" fill="none" stroke="#fff" stroke-width="4" opacity="0"/><circle class="halo2" r="${BR+4}" fill="none" stroke="#ffe58a" stroke-width="9" opacity="0"/><ellipse cx="2" cy="${BR*.92}" rx="${BR*.95}" ry="${BR*.4}" fill="url(#bsh)"/><g class="body">${ballBody(sk,c)}</g>`;
function ensureDefs(sk,c){
  const key=skinKey(sk,c);if(G.grads.has(key))return;G.grads.add(key);
  const d=(SK[sk]||SK.candy).defs(c,key);if(d)el.track.querySelector('defs').insertAdjacentHTML('beforeend',d);
}
/* a small standalone picture of a skin, for the shop and the collection */
let svgSeq=0;
function skinSvg(sk,cols,size=64){
  const n=cols.length,W=n*46,pfx='k'+(++svgSeq)+'_';let defs=BALL_DEFS,body='';
  cols.forEach((c,k)=>{defs+=(SK[sk]||SK.candy).defs(c,skinKey(sk,c));body+=`<g transform="translate(${23+k*46} 25)">${(SK[sk]||SK.candy).body(c,skinKey(sk,c))}</g>`});
  let s=`<svg viewBox="0 0 ${W} 50" width="${size*n*46/50}" height="${size}" aria-hidden="true"><defs>${defs}</defs>${body}</svg>`;
  // ids must be unique in the page: a hidden screen's gradients cannot be used by the visible one
  [...new Set([...s.matchAll(/id="([^"]+)"/g)].map(m=>m[1]))].forEach(id=>{s=s.split(`id="${id}"`).join(`id="${pfx}${id}"`).split(`url(#${id})`).join(`url(#${pfx}${id})`)});
  return s;
}

const STUB={setAttribute(){},remove(){},classList:{add(){},remove(){}},insertAdjacentHTML(){}};
function addBall(d){
  const color=pickColor();G.lastColor=color;G.nSpawn++;if(needed(color))G.nUseful++;
  if(window.__headless){const b={color,d,el:STUB,roll:STUB,halo:STUB,halo2:STUB,dead:false,fade:0,id:rnd(),hv:0};G.balls.unshift(b);return b} // bots play without drawing
  const g=document.createElementNS(NS,'g');g.setAttribute('class','ball');
  ensureDefs(G.skin,color);g.innerHTML=ballFull(G.skin,color);
  G.layer.appendChild(g);
  const b={color,d,el:g,roll:g.querySelector('.roll')||STUB,halo:g.querySelector('.halo'),halo2:g.querySelector('.halo2'),dead:false,fade:0,id:Math.random(),hv:0};
  G.balls.unshift(b);return b; // newest (smallest d) first
}
function renderBalls(){
  if(window.__headless)return;
  const T=G.track,rv=G.fx.reveal>0;
  for(const b of G.balls){
    const p=T.at(b.d);let s=1,o=1;
    if(T.inside&&b.d>T.len-30)s=Math.max(0,(T.len-b.d)/30);
    if(b.pop){const k=Math.min(1,b.fade/.2);s*=1+.55*k;o=1-k}
    else if(b.dead){s*=Math.max(0,1-b.fade*2.4)}
    let hv=0;
    if(rv&&!b.dead){if(needed(b.color)){hv=.65+.35*Math.sin(G.t*9+b.id*10);s*=1+.07*Math.sin(G.t*9+b.id*10)}else o*=.32}
    const sh=b.dead&&b.wrongShake?Math.sin(b.fade*60)*3:0;
    b.el.setAttribute('transform',`translate(${(p.x+sh).toFixed(1)} ${p.y.toFixed(1)}) scale(${s.toFixed(3)})`);
    b.roll.setAttribute('transform',`rotate(${(b.d/BR*57.3).toFixed(1)})`);
    if(o!==b.o){b.el.setAttribute('opacity',o.toFixed(2));b.o=o}
    if(hv!==b.hv){b.halo.setAttribute('opacity',hv.toFixed(2));b.halo2.setAttribute('opacity',(hv*.55).toFixed(2));b.hv=hv}
  }
}
function moveBalls(dt){
  const T=G.track,L=G.lvl;
  let sp=L.speed*(1+(L.pulse?L.pulse*Math.sin(G.t*.8):0));
  if(G.fx.slow>0)sp*=.38;
  const v=sp*dt;
  for(const b of G.balls){b.d+=v;if(b.dead)b.fade+=dt}
  if(G.state==='playing'){
    G.spawnAcc+=v;
    while(G.spawnAcc>=G.spacing){G.spawnAcc-=G.spacing;addBall(G.spawnAcc)}
  }
  for(let i=G.balls.length-1;i>=0;i--){
    const b=G.balls[i];
    if(b.d>T.len+(T.inside?0:30)||(b.dead&&b.fade>(b.pop?.2:.42))){b.el.remove();G.balls.splice(i,1)}
  }
  renderBalls();
}

/* ---------- input ---------- */
function ballAt(cx,cy){
  const svg=el.track,m=svg.getScreenCTM();if(!m)return null;
  const pt=new DOMPoint(cx,cy).matrixTransform(m.inverse());
  let best=null,bd=BR*1.5;
  for(const b of G.balls){
    if(b.dead)continue;const p=G.track.at(b.d);
    if(p.x<8||p.x>392||p.y<0||p.y>260)continue;
    const d=Math.hypot(p.x-pt.x,p.y-pt.y);if(d<bd){bd=d;best=b}
  }
  return best;
}
el.trackwrap.addEventListener('pointerdown',e=>{
  if(G.state!=='playing'||G.cleared)return;
  e.preventDefault();
  const b=ballAt(e.clientX,e.clientY);if(b)tapBall(b);
});
function tapBall(b){
  if(G.state!=='playing'||G.cleared||b.dead)return;
  const info=G.colors.get(b.color);
  if(info&&info.rem>0)correct(b,info);else wrong(b);
}
function ballClient(b){
  const p=G.track.at(b.d),m=el.track.getScreenCTM();
  return new DOMPoint(p.x,p.y).matrixTransform(m);
}
function partClient(part){return new DOMPoint(part.tx,part.ty).matrixTransform(el.art.getScreenCTM())}
const toFx=pt=>{const r=el.fx.getBoundingClientRect();return{x:pt.x-r.left,y:pt.y-r.top}};

function correct(b,info){
  G.combo++;G.maxCombo=Math.max(G.maxCombo,G.combo);
  const pts=100+Math.min(G.combo-1,6)*25;G.score+=pts;setScore();
  const part=nextPart(b.color);part.painted=true;info.rem--;G.remaining--;
  chipUpdate(info);setProgress();
  const HL=!!window.__headless,from=HL?{x:0,y:0}:toFx(ballClient(b)),to=HL?{x:0,y:0}:toFx(partClient(part));
  if(!HL){
    burst(from.x,from.y,b.color,9,150,3.5);
    floats.push({x:from.x,y:from.y-18,text:'+'+pts,life:.9,max:.9});
    if(G.combo>=3)floats.push({x:from.x,y:from.y-44,text:`רצף ${G.combo}`,life:.9,max:.9,small:true});
  }
  orbs.push({x0:from.x,y0:from.y,x1:to.x,y1:to.y,cx:(from.x+to.x)/2+(rnd()*80-40),cy:Math.min(from.y,to.y)-70,t:0,dur:.5,wait:0,color:b.color,part,last:G.remaining===0});
  b.dead=true;b.pop=true;b.fade=0;
  sfx.tap(G.combo);vib(8);
  if(G.remaining===0)G.cleared=true;
}
function wrong(b){
  b.dead=true;b.wrongShake=true;b.el.classList.add('wrong');
  b.el.insertAdjacentHTML('beforeend','<path d="M-8 -8L8 8M8 -8L-8 8" stroke="#fff" stroke-width="4" stroke-linecap="round"/>');
  G.lives--;G.mistakes++;G.combo=0;
  setHearts(G.lives);
  if(!window.__headless){
    el.gwrap.classList.remove('shake');void el.gwrap.offsetWidth;el.gwrap.classList.add('shake');
    el.flash.classList.remove('on');void el.flash.offsetWidth;el.flash.classList.add('on');
  }
  if(!window.__headless){const p=toFx(ballClient(b));burst(p.x,p.y,'#8a8fae',8,120,3)}
  sfx.wrong();vib([30,40,30]);
  if(G.lives<=0){G.cleared=true;finish(false,'lives')}
}
el.gwrap.addEventListener('animationend',e=>{if(e.target===el.gwrap)el.gwrap.classList.remove('shake')});
el.flash.addEventListener('animationend',()=>el.flash.classList.remove('on'));
function timeUp(){G.cleared=true;finish(false,'time')}
/* ================= pvp: a race against another player, or against a bot when nobody is free ================= */
const BOT_NAMES=['נועה','איתי','דנה','יואב','מאיה','אורי','שירה','עומר','ליאור','תמר','גיל','רותם','אלון','הילה','נדב','ספיר','אריאל','ענבר'];
const BOT_COLORS=['#ff6fae','#4dbbff','#2dbe6c','#ff8a2b','#9b5cf6','#12b5a6','#ff4d5e'];
const pvpCoins=n=>Math.round((25+n*.6)*(n%10===0?1.5:n%5===0?1.25:1));
/* a bot finishes the picture in `fac` times the time of flawless play: 20% fast, 50% medium, 30% slow */
function makeBot(){
  const r=rnd(),fac=r<.2?lerp(1.12,1.25,rnd()):r<.7?lerp(1.25,1.5,rnd()):lerp(1.5,1.9,rnd());
  return{type:'bot',name:BOT_NAMES[Math.floor(rnd()*BOT_NAMES.length)],color:BOT_COLORS[Math.floor(rnd()*BOT_COLORS.length)],fac,phase:rnd()*6};
}
/* there is no matchmaking server yet, so every search ends with a bot; a real lobby would be plugged in here */
function findOpponent(){return new Promise(res=>setTimeout(()=>res(makeBot()),window.__headless?0:2200))}
let pvpSearch=0;
async function startPvp(){
  const id=++pvpSearch;
  const n=Math.max(1,Math.min(TOTAL_C,nextOpen('c')+Math.floor(rnd()*7)-3));
  openModal(`<h2>מחפשים יריב...</h2><div class="spinner"></div><p>מחפשים שחקן פנוי בשלב ${n}</p><div class="row"><button class="btn small" id="mCancel" type="button">ביטול</button></div>`);
  document.getElementById('mCancel').onclick=()=>{pvpSearch++;sfx.click();closeModal()};
  const opp=await findOpponent(n);
  if(id!==pvpSearch)return;
  el.mbox.innerHTML=`<h2>נמצא יריב</h2><p>אין שחקנים פנויים כרגע, אז תתמודדו מול בוט.</p><div class="vs"><div class="who"><div class="avatar" style="background:#5b4bdb;font-size:22px">אני</div><span>אתם</span></div><span>נגד</span><div class="who"><div class="avatar" style="background:${opp.color}">${opp.name[0]}</div><span>${opp.name} (בוט)</span></div></div><p>שלב ${n} · פרס על ניצחון ${pvpCoins(n)} מטבעות</p>`;
  setTimeout(()=>{if(id!==pvpSearch)return;el.modal.hidden=true;el.mbox.innerHTML='';startLevel('p',n,opp)},window.__headless?0:1800);
}
function pvpStep(dt){
  const P=G.pvp;if(!P||G.cleared)return;
  P.t+=dt;const u=Math.min(1,P.t/P.T);
  P.prog=Math.max(P.prog,Math.min(1,u+.035*Math.sin(u*9+P.phase)*(1-u)));
  el.oppBar.style.width=(P.prog*100).toFixed(1)+'%';
  if(u>=1){G.cleared=true;finish(false,'pvp')}
}

function finish(win,why){
  if(G.state==='finishing'||G.state==='over')return;
  G.state='finishing';
  const T=G.mode==='t';
  G.gain={coins:0,gems:0};G.reward=[];
  const glow=()=>{el.card.classList.remove('glow');void el.card.offsetWidth;el.card.classList.add('glow');confetti();sfx.win();vib([20,30,20,30,60])};
  if(G.mode==='p'){ // a race: coins for a win, a small consolation otherwise, no stars
    const coins=win?pvpCoins(G.n):5;G.gain.coins=coins;save.coins+=coins;
    if(win)save.pvp.w++;else save.pvp.l++;
    persist();
    if(win)after(.35,glow);else sfx.lose();
    after(win?1.5:1.0,()=>{G.state='over';showEnd(win,0,why)});
    return;
  }
  if(win){
    let stars;
    if(T){const r=(G.limit-G.time)/G.refTime;stars=r<=1.15?3:r<=1.45?2:1}else stars=Math.max(1,G.lives);
    G.stars=stars;
    after(.35,glow);
    const S=T?save.tstars:save.stars,B=T?save.tbest:save.best,prevStars=S[G.n]||0;
    S[G.n]=Math.max(prevStars,stars);B[G.n]=Math.max(B[G.n]||0,G.score);
    // coins and diamonds are paid only for what is new: a better result pays the difference to the one already paid
    G.gain={coins:Math.max(0,coinsFor(stars,G.n,T)-coinsFor(prevStars,G.n,T)),gems:stars>=3&&prevStars<3?gemsFor(G.n):0};
    save.coins+=G.gain.coins;save.gems+=G.gain.gems;
    // a power-up reward only for a first clear or a better result, so replaying an easy level cannot be farmed
    const cnt=stars>prevStars?(prevStars===0&&stars===3?2:1)+(G.lvl.kind==='boss'&&prevStars===0?1:0):0;
    for(let i=0;i<cnt;i++){const k=PKEYS[Math.floor(rnd()*PKEYS.length)];if(save.inv[k]<99){save.inv[k]++;G.reward.push(k)}}
    persist();
    after(1.5,()=>{G.state='over';showEnd(true,stars)});
  }else{
    sfx.lose();
    after(1.0,()=>{G.state='over';showEnd(false,0,why)});
  }
}
function showEnd(win,stars,why){
  const P=G.mode==='p',T=G.mode==='t',total=totalOf(P?'c':G.mode),last=!P&&G.n>=total;
  el.eStars.innerHTML=win?(P?'':[1,2,3].map(k=>starSvg(k<=stars,k<=stars?'on':'')).join('')):BROKEN_HEART;
  el.eStars.hidden=win&&P;
  [...el.eStars.querySelectorAll('.on')].forEach((s,i)=>s.style.animationDelay=(.15+i*.2)+'s');
  if(P){
    el.eTitle.textContent=win?`ניצחתם את ${G.opp.name}!`:(why==='pvp'?'היריב סיים קודם':'נפסלתם');
    el.eSub.textContent=win?'הכי מהירים. הפרס שלכם מחכה.':(why==='pvp'?'פעם הבאה תהיו מהירים יותר.':'שלוש טעויות והקרב נגמר.');
    el.eStat.innerHTML=`<div><b>${fmtTime(G.t)}</b><span>הזמן שלכם</span></div><div><b>${Math.round((G.pvp?G.pvp.prog:0)*100)}%</b><span>ההתקדמות של ${G.opp.name}</span></div>`;
  }else{
    el.eTitle.textContent=win?(stars===3?'ציור מושלם!':stars===2?'כל הכבוד!':'הצלחתם!'):(why==='time'?'נגמר הזמן':'נפסלתם');
    el.eSub.textContent=win?(last?(T?'סיימתם את כל שלבי השעון.':'סיימתם את כל 200 השלבים. איזה אוסף צבעים.'):'הציור הושלם.'):(why==='time'?'השעון הקדים אתכם. נסו שוב מהר יותר.':`${G.maxLives===2?'שתי':'שלוש'} טעויות והסיבוב נגמר. הציור עדיין מחכה לכם.`);
    const B=(T?save.tbest:save.best)[G.n]||0;
    el.eStat.innerHTML=win?`<div><b>${G.score.toLocaleString('he-IL')}</b><span>ניקוד</span></div>${T?`<div><b>${fmtTime(G.limit-G.time)}</b><span>זמן</span></div>`:`<div><b>${G.maxCombo}</b><span>רצף ארוך</span></div>`}<div><b>${B.toLocaleString('he-IL')}</b><span>שיא</span></div>`:'';
  }
  const gn=G.gain||{coins:0,gems:0};let r='';
  if(gn.coins)r+=`<span class="rcoin">${COIN}+${gn.coins}</span>`;
  if(gn.gems)r+=`<span class="rcoin">${GEM}+${gn.gems}</span>`;
  for(const k of G.reward||[])r+=`<span class="rcoin"><span class="pwchip ${k}">${POWERS[k].icon}</span>+1</span>`;
  if(!r&&win&&!P)r='<span class="none">כבר קיבלתם פרס על תוצאה כזו או טובה יותר</span>';
  el.eReward.innerHTML=r;renderTop(gn.gems?'gem':gn.coins?'coin':false);
  el.eBtns.innerHTML='';
  const mk=(txt,cls,fnc)=>{const b=document.createElement('button');b.type='button';b.className='btn '+cls;b.textContent=txt;b.onclick=()=>{sfx.click();fnc()};el.eBtns.appendChild(b)};
  if(P){mk('קרב נוסף','primary',()=>{toMenu();startPvp()});mk('תפריט','small',toMenu)}
  else{
    if(win&&!last)mk('לשלב הבא','primary',()=>startLevel(G.mode,G.n+1));
    else if(!win)mk('נסו שוב','primary',()=>startLevel(G.mode,G.n));
    else mk('לתפריט','primary',toMenu);
    if(win)mk('שוב','small',()=>startLevel(G.mode,G.n));
    mk('תפריט','small',toMenu);
  }
  openSheet(el.end,!win);
}
function toMenu(){
  tweens.length=0;orbs.length=0;fxp.length=0;floats.length=0;hideSheets();G.loadId++;
  el.count.hidden=true;el.gwrap.classList.remove('shake');el.flash.classList.remove('on');
  G.state='menu';
  if(G.mode==='p')save.tab='pvp';
  else{save.mode=G.mode||save.mode;save.page[save.mode]=Math.floor((G.n-1)/PER_PAGE);save.tab='home'}
  persist();showScreen('menu');renderMenu();showTab(save.tab);
}

/* ready / pause */
function pauseGame(){
  if(G.state!=='playing')return;

}
function resume(){

/* ================= effects (canvas) ================= */
const orbs=[],fxp=[],floats=[];
const ctx=el.fx.getContext('2d');let DPR=1,FW=0,FH=0;
function resizeFx(){
  const r=el.fx.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);FW=r.width;FH=r.height;
  el.fx.width=Math.max(1,Math.round(FW*DPR));el.fx.height=Math.max(1,Math.round(FH*DPR));
}
window.addEventListener('resize',resizeFx);
function burst(x,y,color,n=12,sp=160,size=4){
  for(let i=0;i<n;i++){const a=rnd()*Math.PI*2,s=sp*(.35+rnd()*.85);fxp.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,life:.45+rnd()*.35,max:.8,color,size:size*(.6+rnd()*.9),g:380,shape:'c',rot:0,vr:0})}
}
function confetti(){
  if(window.__headless)return;
  for(let i=0;i<150;i++){
    const x=rnd()*FW;
    fxp.push({x,y:-20-rnd()*FH*.35,vx:(rnd()-.5)*140,vy:140+rnd()*240,life:2.6+rnd()*1.4,max:4,color:ALLC[Math.floor(rnd()*ALLC.length)],size:5+rnd()*6,g:60,shape:'r',rot:rnd()*6,vr:(rnd()-.5)*12});
  }
}
function stepFx(dt){
  for(let i=orbs.length-1;i>=0;i--){
    const o=orbs[i];
    if(o.wait>0){o.wait-=dt;o.x=o.x0;o.y=o.y0;o.idle=true;continue}
    o.idle=false;o.t+=dt/o.dur;const t=Math.min(1,o.t),e=t*t*(3-2*t),u=1-e;
    o.x=u*u*o.x0+2*u*e*o.cx+e*e*o.x1;o.y=u*u*o.y0+2*u*e*o.cy+e*e*o.y1;
    if(!window.__headless&&rnd()<.8)fxp.push({x:o.x,y:o.y,vx:(rnd()-.5)*40,vy:(rnd()-.5)*40,life:.3,max:.3,color:o.color,size:5,g:0,shape:'c',rot:0,vr:0});
    if(t>=1){
      orbs.splice(i,1);paintPart(o.part);sfx.paint();
      if(!window.__headless){burst(o.x1,o.y1,o.color,14,190,4);floats.push({x:o.x1,y:o.y1-8,text:o.part.pct+'%',life:1.1,max:1.1,pct:true})}
      if(o.last)finish(true);
    }
  }
  for(let i=fxp.length-1;i>=0;i--){
    const p=fxp[i];p.life-=dt;if(p.life<=0){fxp.splice(i,1);continue}
    p.vy+=p.g*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.rot+=p.vr*dt;
  }
  for(let i=floats.length-1;i>=0;i--){const f=floats[i];f.life-=dt;f.y-=34*dt;if(f.life<=0)floats.splice(i,1)}
  drawFx();
}
function drawFx(){
  if(window.__headless)return;
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,FW,FH);
  for(const p of fxp){
    ctx.globalAlpha=Math.max(0,Math.min(1,p.life/p.max*1.4));ctx.fillStyle=p.color;
    if(p.shape==='c'){ctx.beginPath();ctx.arc(p.x,p.y,p.size*Math.max(.3,p.life/p.max+.3),0,6.283);ctx.fill()}
    else{ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillRect(-p.size/2,-p.size/3,p.size,p.size*.6);ctx.restore()}
  }
  ctx.globalAlpha=1;
  for(const o of orbs){
    if(o.idle)continue;
    const g=ctx.createRadialGradient(o.x,o.y,2,o.x,o.y,22);g.addColorStop(0,o.color);g.addColorStop(1,'rgba(255,255,255,0)');
    ctx.globalAlpha=.55;ctx.fillStyle=g;ctx.beginPath();ctx.arc(o.x,o.y,22,0,6.283);ctx.fill();
    ctx.globalAlpha=1;ctx.fillStyle=o.color;ctx.strokeStyle='#fff';ctx.lineWidth=3;ctx.beginPath();ctx.arc(o.x,o.y,10,0,6.283);ctx.fill();ctx.stroke();
  }
  for(const f of floats){
    ctx.globalAlpha=Math.min(1,f.life/f.max*2);ctx.textAlign='center';ctx.direction='ltr';ctx.font=`${f.small?700:800} ${f.small?15:22}px Rubik,system-ui,sans-serif`;
    ctx.lineWidth=5;ctx.strokeStyle='#fff';ctx.lineJoin='round';ctx.strokeText(f.text,f.x,f.y);ctx.fillStyle=f.small?'#e0a200':'#1b1e45';ctx.fillText(f.text,f.x,f.y);
  }
  ctx.globalAlpha=1;
}

/* ================= main loop ================= */
function update(dt){
  if(G.state==='menu'||G.state==='paused'||G.state==='loading')return;
  if(G.state==='countdown'){
    G.cd-=dt;const k=Math.max(0,Math.ceil(G.cd));
    if(k!==G.cdShown){G.cdShown=k;if(k>0){el.cnNum.textContent=k;el.cnNum.classList.remove('pop');void el.cnNum.offsetWidth;el.cnNum.classList.add('pop');sfx.tick()}}
    if(G.cd<=0)startPlay();
    return;
  }
  stepTimers(dt);
  if(G.state==='playing'){
    G.t+=dt;pvpStep(dt);
    if(G.fx.reveal>0){G.fx.reveal=Math.max(0,G.fx.reveal-dt)}
    if(G.fx.slow>0){G.fx.slow=Math.max(0,G.fx.slow-dt)}
    const act=G.fx.reveal>0||G.fx.slow>0;if(act||G.pwWas)refreshPowers();G.pwWas=act;
    if(G.lvl.timed&&!G.cleared){
      const before=Math.ceil(G.time);G.time-=dt;
      if(Math.ceil(G.time)!==before){setScore();if(G.time<=10&&G.time>0)sfx.tick()}
      if(G.time<=0){G.time=0;setScore();timeUp()}
    }
  }
  if(G.state==='playing'||G.state==='finishing')moveBalls(dt);
  stepFx(dt);
}
let last=0;
function frame(ts){
  requestAnimationFrame(frame);
  const dt=Math.min(.05,(ts-last)/1000||0);last=ts;
  update(dt);
}

window.__cr={G,save,needed,renderTop,renderHome,goSide,openSettings,openProfile,openWelcome,saveProfile,specialLeft,renderDock,AVATARS,paintPart,coinsFor,gemsFor,pvpCoins,buyChest,buyPower,equipSkin,showTab,renderShop,openModal,closeModal,startPvp,makeBot,normalizeSave,shopState,dayStr,POWER_PRICE,POWER_DAILY,CHEST_COINS,CHEST_GEMS,SK,SKIN_IDS,skinSvg,PIC_PARTS,PIC_ORDER,usefulFrac,TRACKS,TRACK_TIERS,makeTrack,levelDef,makePool,getPicture,startLevel,tapBall,update,toMenu,usePower,POWERS,renderMenu,pauseGame,resume,nextOpen,cdist,PKEYS,persist,
